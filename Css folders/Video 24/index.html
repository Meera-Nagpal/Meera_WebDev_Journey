<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Shadows</title>
    <style>
        .box {
            border: 8px solid gold;
            display: flex;
            padding: 56px;
            margin: 45px;
            width: 345px;
            box-shadow: 5px 5px 5px #a71515;
            text-shadow: 2px 2px 2px #a71515;
            outline: 4px solid blueviolet ;
            border-radius: 7px;
            outline-offset: 20px; 
    </style>
</head>

<body>
    <div class="box">
        I am a champ
    </div>
    <div class="box">
        and intelligent boy
    </div>
    <span class="box1">
        Hey There,wassup
    </span>
    <span>
        are you goin good?
    </span>

</body>

</html>
