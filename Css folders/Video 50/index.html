<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filterss</title>
    <style>
        .container {
            width: 488px;
            height: 466px;
        }
        .image1{
            /* filter: brightness(100%) blur(0px)sepia(100%); */
            filter: opacity(0.6)
            

        }
        .image2{
            /* filter: brightness(100%) blur(0px) sepia(100%); */

        }
       .image3{
            filter: brightness(100%) blur(0px) grayscale(60%);

        }
    </style>
</head>

<body>
    <div class="container">
        <img class="image1"src="https://cinetown.s3.ap-south-1.amazonaws.com/people/profile_img/1699040622.jpeg">
        <img class="image2"src="https://encrypted-tbn3.gstatic.com/images?q=tbn:ANd9GcTsMhrtIaPwW735r8w2-TNmYds-vfQeh5RD29jbSSVJZktbg5hgUl7FsvrXk7U4REJOi4Vvq4S-0ecbUxoELeMobA">
        <img class="image3"src="https://cdn.britannica.com/96/244696-050-E23F34B9/Bollywood-actress-Kajol-2022.jpg">
    </div>

</body>

</html>
