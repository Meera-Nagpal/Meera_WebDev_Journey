<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List styles</title>
    <style>
        nav ol li{
            list-style: Devanagari;
            background-color: yellow;
            list-style-position: inside;
            border: 5px solide green;
            list-style-type: disc;
            

        }
    </style>
</head>
<body>
    <nav>
        <ul>
            <li>Meera</li>
            <li>Parth</li>
            <li>Riya</li>
        </ul>
    </nav>
</body>
</html>
