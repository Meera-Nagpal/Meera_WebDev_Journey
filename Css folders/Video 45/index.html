<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transition Property</title>

    <style>
        .box {
            height: 50px;
            width: 50px;
            background-color: rgb(151, 151, 8);
            border: 4px double rgb(255, 47, 99);
            /* transition:background-color, transform;
            transition-duration:3s ;
            transition-timing-function:ease-in-out ;
            transition-delay:1s ; */
            transition:all 3s cubic-bezier(0.89,-0.29, 1, 1) 1s;
        }

        .container {
            height: 100vw;
            width: 100vh;
            background-color: rgb(9, 61, 173);
            border: 4px double rgba(12, 10, 10, 0.041);
        }

        .translate {
            transform: translateX(10vw) translateY(10vh) scale(2);
            background-color: rgb(110, 0, 55);

        }
    </style>
</head>

<body>
    <div class="container">
        <div class="box translate">
            Box
        </div>
    </div>
</body>

</html>
