<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data input</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Hiring people to give reviews on Saiyaara </h1>
    <form action="post ">
    <label for="username">Enter your username</label>
    
    <input type="text" id="username" name="username" placeholder="Enter your name">
    <div>
          <label for="gender">Enter your gender</label>
    <input type="radio" id="male" name="gender" value="male">
    <label for="male" >Male</label>
    <input type="radio" id="Female" name="gender" value="Female">
    <label for="Female">Female</label>
    <input type="radio" id="Other" name="gender" value="other">
    <label for="Other">Other</label>
    </div>
    <div>
        <input type="checkbox" id="subscribe" name="subscribe" value="yes">
        <label for="subscribe">Subscribed to  his channal Ahaan Panday</label>
    </div>
    <div>
        <label for="comment"></label>
        <textarea id="comment" name="comment" rows="4" cols="50" placeholder="Enter your comments"></textarea>.</textarea>
    </div>
    <div> 
        <select name="fruits">
            <option value="apple">Apple</option>
            <option value="banana">Banana</option>
            <option value="pineapple">Pineapple</option>
        </select>
    </div>
    </form>
</body>
</html>
