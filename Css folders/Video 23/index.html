<!DOCTYPE html>
<html lang="en">
<head>

    <title>CSS DISPLAY PROPERTIES</title>

            margin: 0px;
            padding: 0px;
        }
        .box{

            display: flex;
            padding: 56px;

</head>
<body>

        I am a champ

    <div class="box">

    </span>
    <span>
        are you goin good?
    </span>

</body>
</html>
