<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>CSS Box Model </title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .box{
            color: rgb(202, 6, 6);
            font-size: larger;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            font-weight: 900;
        }
        .box1{
            background-color: rgb(142, 253, 38);
            padding: 10px;
            margin: 10px;
            border: 8px solid black;
            height: 300px;
            width: 2000px;
            box-sizing: border-box;
        }
        .box2{
            background-color: rgb(80, 255, 255);
            padding: 20px;
            margin: 5px;
            border: 4px solid black;
            height: 200px;
            width: 2000px;
            box-sizing: border-box;

        }
    </style>
</head>
<body>
    <div class="box box1">
        Hey I am clone of Spotify!
    </div>
    <div class="box box2">
        Hey I am a clone of Insta
    </div>
</body>
</html>
